# 운영(EC2)용. DB는 RDS, HTTPS는 EC2의 Nginx가 처리함
# 같은 폴더에 .env.prod 필요 (.env.prod.example 참고)
name: kitup

x-app: &app
  image: ghcr.io/kitup-4line/kitup-backend:${IMAGE_TAG:-latest}
  env_file: .env.prod
  environment:
    DB_SSLMODE: verify-full
    PGSSLROOTCERT: /run/certs/rds-ca.pem
  volumes:
    - type: bind
      source: /srv/kitup/rds-ca.pem
      target: /run/certs/rds-ca.pem
      read_only: true
      bind:
        create_host_path: false
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"   # Nginx만 접근

  # 리포트 리뷰 분석·개선안 생성 처리
  worker:
    <<: *app
    command: ["python", "manage.py", "qcluster"]
